services:
  - type: web
    name: beyond21-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: JWT_SECRET
        generateValue: true
  - type: web
    name: beyond21-frontend
    runtime: node
    buildCommand: cd Frontend && npm install && npm run build
    startCommand: cd Frontend && node server.mjs
    envVars:
      - key: VITE_API_URL
        value: https://beyond21.onrender.com
